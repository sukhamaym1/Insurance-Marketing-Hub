<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Insurance Marketing Hub | Create & Personalize Insurance Marketing Designs</title>
    <meta name="title" content="Insurance Marketing Hub | Create & Personalize Insurance Marketing Designs" />
    <meta name="description" content="Insurance Marketing Hub (IMH) is the ultimate marketing platform for Insurance Agents, Advisors & Financial Consultants to personalize, download, and share HD marketing banners." />
    <meta name="theme-color" content="#2563EB" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://insurancemarketinghub.com/" />
    <meta property="og:title" content="Insurance Marketing Hub | Professional Social Media Posts in Seconds" />
    <meta property="og:description" content="Browse 1000+ templates for Life, Health, Investment & Festival insurance posts. Auto-apply your Brand Kit with photo, logo, and contact info in one click." />
    <meta property="og:image" content="https://insurancemarketinghub.com/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Insurance Marketing Hub | Enterprise Insurance Marketing Platform" />
    <meta property="twitter:description" content="Personalize high-definition marketing posters, social media banners & recruitment ads with your agent branding." />
    <meta property="twitter:image" content="https://insurancemarketinghub.com/og-image.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-[#0B1220] text-slate-100 antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
